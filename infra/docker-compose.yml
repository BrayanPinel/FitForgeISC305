# backend/docker-compose.yml
version: '3.8'
services:
  db-fitforge:
    image: postgres:16-alpine
    container_name: postgres-fitforge
    env_file:
      - .env # Inyecta las variables de entorno aquí
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: